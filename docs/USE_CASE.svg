<svg viewBox="0 0 1320 880" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Diagramme de cas d'usage La Forge du Code</title>
  <desc id="d">Acteurs Visiteur, Apprenant et Service Email avec les cas d'usage de la plateforme.</desc>
  <defs>
    <marker id="open" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#64748b" stroke-width="1.4"/></marker>
    <marker id="tri" markerWidth="16" markerHeight="16" refX="13" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,6 L1,11 Z" fill="#fff" stroke="#475569" stroke-width="1.4"/></marker>
  </defs>
  <rect x="0" y="0" width="1320" height="880" fill="#f8fafc"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">Cas d'usage — La Forge du Code</text>

  <!-- system boundary -->
  <rect x="300" y="110" width="770" height="720" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="1.8"/>
  <text x="685" y="138" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">La Forge du Code (système)</text>

  <!-- ===== ACTORS ===== -->
  <!-- Visiteur -->
  <g stroke="#1d4ed8" stroke-width="2" fill="none">
    <circle cx="120" cy="232" r="13" fill="#eff6ff"/>
    <line x1="120" y1="245" x2="120" y2="280"/>
    <line x1="98" y1="258" x2="142" y2="258"/>
    <line x1="120" y1="280" x2="104" y2="304"/>
    <line x1="120" y1="280" x2="136" y2="304"/>
  </g>
  <text x="120" y="326" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Visiteur</text>
  <text x="120" y="343" font-size="11" fill="#64748b" text-anchor="middle">(anonyme)</text>
  <!-- Apprenant -->
  <g stroke="#7c3aed" stroke-width="2" fill="none">
    <circle cx="120" cy="552" r="13" fill="#f5f3ff"/>
    <line x1="120" y1="565" x2="120" y2="600"/>
    <line x1="98" y1="578" x2="142" y2="578"/>
    <line x1="120" y1="600" x2="104" y2="624"/>
    <line x1="120" y1="600" x2="136" y2="624"/>
  </g>
  <text x="120" y="646" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Apprenant</text>
  <text x="120" y="663" font-size="11" fill="#64748b" text-anchor="middle">(connecté)</text>
  <!-- generalization Apprenant -> Visiteur -->
  <line x1="120" y1="525" x2="120" y2="360" stroke="#475569" stroke-width="1.6" marker-end="url(#tri)"/>
  <text x="132" y="445" font-size="10.5" fill="#64748b" font-style="italic">est un</text>

  <!-- Service Email -->
  <g stroke="#7c3aed" stroke-width="2" fill="none">
    <circle cx="1200" cy="232" r="13" fill="#f5f3ff"/>
    <line x1="1200" y1="245" x2="1200" y2="280"/>
    <line x1="1178" y1="258" x2="1222" y2="258"/>
    <line x1="1200" y1="280" x2="1184" y2="304"/>
    <line x1="1200" y1="280" x2="1216" y2="304"/>
  </g>
  <text x="1200" y="326" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Service Email</text>
  <text x="1200" y="343" font-size="11" fill="#64748b" text-anchor="middle">(Resend)</text>

  <!-- ===== USE CASES (ellipses) ===== -->
  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <ellipse cx="470" cy="195" rx="96" ry="30" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="470" y="200">S'inscrire</text>
    <ellipse cx="730" cy="195" rx="100" ry="30" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="730" y="200">Vérifier son email</text>
    <ellipse cx="470" cy="275" rx="96" ry="30" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="470" y="280">Se connecter</text>
    <ellipse cx="730" cy="285" rx="108" ry="32" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="730" y="282">Réinitialiser le</text><text x="730" y="298">mot de passe</text>

    <ellipse cx="470" cy="375" rx="96" ry="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="470" y="380">Configurer l'avatar</text>
    <ellipse cx="470" cy="455" rx="96" ry="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="470" y="460">Parcourir les cursus</text>
    <ellipse cx="710" cy="455" rx="98" ry="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="710" y="460">Réaliser un exercice</text>
    <ellipse cx="940" cy="455" rx="104" ry="32" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="940" y="452">Sauvegarder la</text><text x="940" y="468">progression</text>
    <ellipse cx="710" cy="545" rx="98" ry="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="710" y="550">Gagner XP &amp; badges</text>
    <ellipse cx="470" cy="545" rx="100" ry="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="470" y="550">Consulter le classement</text>
    <ellipse cx="470" cy="625" rx="96" ry="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="470" y="630">Consulter son profil</text>
    <ellipse cx="470" cy="705" rx="96" ry="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="470" y="710">Se déconnecter</text>
  </g>

  <!-- ===== ASSOCIATIONS ===== -->
  <g stroke="#1d4ed8" stroke-width="1.3" fill="none" opacity="0.8">
    <line x1="146" y1="250" x2="378" y2="200"/>
    <line x1="146" y1="255" x2="636" y2="195"/>
    <line x1="146" y1="262" x2="378" y2="272"/>
    <line x1="146" y1="268" x2="628" y2="280"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.3" fill="none" opacity="0.8">
    <line x1="146" y1="556" x2="378" y2="380"/>
    <line x1="146" y1="558" x2="378" y2="455"/>
    <line x1="146" y1="560" x2="616" y2="452"/>
    <line x1="146" y1="566" x2="616" y2="540"/>
    <line x1="146" y1="566" x2="374" y2="545"/>
    <line x1="146" y1="572" x2="378" y2="623"/>
    <line x1="146" y1="578" x2="378" y2="700"/>
  </g>
  <!-- Service Email associations -->
  <g stroke="#7c3aed" stroke-width="1.3" fill="none" opacity="0.8">
    <line x1="1174" y1="248" x2="828" y2="198"/>
    <line x1="1174" y1="262" x2="836" y2="288"/>
  </g>

  <!-- include / extend -->
  <line x1="808" y1="455" x2="838" y2="455" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="822" y="446" font-size="10.5" fill="#475569" text-anchor="middle" font-style="italic">«include»</text>
  <line x1="710" y1="485" x2="710" y2="514" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="765" y="503" font-size="10.5" fill="#475569" text-anchor="middle" font-style="italic">«extend»</text>

  <!-- legend -->
  <g font-size="11.5" fill="#475569">
    <rect x="40" y="760" width="230" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="54" y="782" font-weight="700" fill="#0f172a">Légende</text>
    <line x1="54" y1="800" x2="84" y2="800" stroke="#475569" stroke-width="1.6" marker-end="url(#tri)"/><text x="94" y="804">généralisation (est un)</text>
    <line x1="54" y1="824" x2="84" y2="824" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="94" y="828">«include» / «extend»</text>
  </g>
</svg>
