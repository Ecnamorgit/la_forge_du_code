name: CI

# Intégration continue : à chaque push / pull request sur main et dev,
# on installe les dépendances, on lint, puis on lance les tests unitaires.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Le client Prisma est généré (lib/generated/prisma) et nécessaire au
      # typecheck comme au build.
      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test:run

      # Build de production. DATABASE_URL factice : aucune page n'interroge la
      # base au build (pas de generateStaticParams), l'URL sert juste à
      # instancier le pool Prisma à l'import. La validation d'env (fail-fast)
      # ne tourne qu'au démarrage du serveur, pas au build.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-build-secret-not-used-1234567890

  e2e:
    name: Tests e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-e2e-secret-not-used-1234567890
      # La suite tourne contre `pnpm build && pnpm start`, pas `pnpm dev` :
      # c'est la seule façon d'émettre la CSP (next.config.ts, garde `isProd`)
      # et donc d'exercer réellement l'aperçu React sous la vraie politique.
      # Cf. docs/BRIEF_CSP_GARDE_FOU.md
      E2E_PROD: "1"
      # `instrumentation.ts` valide l'environnement avant la première requête,
      # et `lib/env.ts` durcit ses règles sous NODE_ENV=production : APP_URL
      # https non-localhost, et RESEND_API_KEY présente. Valeurs factices —
      # aucune spec n'envoie d'email ni ne clique un lien de vérification
      # (e2e/global-setup.ts crée l'utilisateur déjà vérifié, en base).
      APP_URL: https://ci.codeforge.invalid
      RESEND_API_KEY: ci-e2e-key-not-used
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e
