name: CI

# Intégration continue : à chaque push / pull request sur main et dev,
# on installe les dépendances, on lint, puis on lance les tests unitaires.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --no-frozen-lockfile : à retirer une fois `pnpm install` relancé en local
      # pour régénérer pnpm-lock.yaml avec vitest.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests unitaires
        run: pnpm test:run
