name: CI

# Lint, typecheck, tests unitaires, build et e2e à chaque push ou pull request
# sur main et dev.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Le jeton GITHUB_TOKEN n'a besoin que de lire le dépôt.
permissions:
  contents: read

jobs:
  quality:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Client Prisma généré (lib/generated/prisma), nécessaire au typecheck
      # comme au build.
      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test:run

      # DATABASE_URL factice : aucune page n'interroge la base au build, l'URL
      # sert seulement à instancier le pool Prisma. La validation de
      # l'environnement n'a lieu qu'au démarrage du serveur.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-build-secret-not-used-1234567890

  e2e:
    name: Tests e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-e2e-secret-not-used-1234567890
      # Suite lancée contre `pnpm build && pnpm start` : la CSP n'est émise
      # qu'en production (proxy.ts, garde `CSP_ACTIVE`). Voir
      # docs/audit-securite/corrections/EXE-03.md.
      E2E_PROD: "1"
      # En production, `lib/env.ts` exige une APP_URL https non-localhost et une
      # RESEND_API_KEY. Valeurs factices : aucune spec n'envoie d'e-mail.
      APP_URL: https://ci.codeforge.invalid
      RESEND_API_KEY: ci-e2e-key-not-used
      # Sans elle, Auth.js refuse localhost en production (UntrustedHost). En
      # local, `.env` la fournit ; elle est aussi requise en production
      # (docs/DEPLOYMENT.md) bien que `lib/env.ts` la déclare optionnelle.
      AUTH_TRUST_HOST: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e
