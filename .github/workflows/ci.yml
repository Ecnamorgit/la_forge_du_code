name: CI

# Lint, typecheck, unit tests, build and e2e on every push or pull request
# to main and dev.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The GITHUB_TOKEN only needs to read the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated Prisma client (lib/generated/prisma), needed by the typecheck
      # as well as the build.
      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test:run

      # Dummy DATABASE_URL: no page queries the database at build time, the URL
      # is only used to instantiate the Prisma pool. Environment validation
      # only happens when the server starts.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-build-secret-not-used-1234567890

  e2e:
    name: Tests e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-e2e-secret-not-used-1234567890
      # Suite run against `pnpm build && pnpm start`: the CSP is only emitted
      # in production (proxy.ts, `CSP_ACTIVE` guard). See
      # docs/audit-securite/corrections/EXE-03.md.
      E2E_PROD: "1"
      # In production, `lib/env.ts` requires an https, non-localhost APP_URL and a
      # RESEND_API_KEY. Dummy values: no spec sends email.
      APP_URL: https://ci.codeforge.invalid
      RESEND_API_KEY: ci-e2e-key-not-used
      # Without it, Auth.js rejects localhost in production (UntrustedHost).
      # Locally, `.env` provides it; it is also required in production
      # (docs/DEPLOYMENT.md) even though `lib/env.ts` declares it optional.
      AUTH_TRUST_HOST: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e
