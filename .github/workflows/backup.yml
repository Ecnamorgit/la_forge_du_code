name: Sauvegarde de la base

# Le plan gratuit Supabase n'inclut aucune sauvegarde : ce workflow fait un
# pg_dump quotidien et le dépose en artefact. Le dump contient les e-mails et
# les hachés de mots de passe : il est chiffré avant de quitter le runner.
#
# Secrets à créer dans Settings > Secrets and variables > Actions.
# BACKUP_DATABASE_URL reçoit la valeur de DIRECT_URL, le pooler sur le port
# 5432 (mode session) : le port 6543 (mode transaction) casse pg_dump, et
# db.<ref>.supabase.co, en IPv6 seul sur les projets gratuits, est injoignable
# depuis un runner GitHub. BACKUP_PASSPHRASE, la phrase de chiffrement, doit
# aussi être conservée hors de GitHub.
#
# Restauration : docs/DEPLOYMENT.md, section 7.

on:
  schedule:
    # 03:00 UTC chaque jour (GitHub peut retarder l'exécution en cas de charge).
    - cron: "0 3 * * *"
  workflow_dispatch:

# Une seule sauvegarde à la fois.
concurrency:
  group: sauvegarde-base
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump chiffré
    runs-on: ubuntu-latest
    steps:
      # `pg_dump` échoue de façon illisible sur une URL mal formée, par exemple
      # la ligne entière du .env au lieu de sa valeur : l'erreur est nommée ici.
      - name: Vérifier les secrets
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          manquants=""
          [ -z "$URL" ] && manquants="$manquants BACKUP_DATABASE_URL"
          [ -z "$PASSPHRASE" ] && manquants="$manquants BACKUP_PASSPHRASE"
          if [ -n "$manquants" ]; then
            echo "::error::Secret(s) manquant(s) :$manquants — cf. l'en-tête de ce fichier."
            exit 1
          fi

          case "$URL" in
            DIRECT_URL=*|DATABASE_URL=*)
              echo "::error::BACKUP_DATABASE_URL contient le nom de la variable en préfixe."
              echo "::error::Attendu : la valeur seule, commençant par postgresql:// — sans « DIRECT_URL= » devant."
              exit 1 ;;
            \"*|\'*)
              echo "::error::BACKUP_DATABASE_URL est entourée de guillemets. Les retirer : un secret GitHub n'en a pas besoin."
              exit 1 ;;
            postgres://*|postgresql://*)
              ;;
            *)
              echo "::error::BACKUP_DATABASE_URL ne commence pas par postgresql:// ni postgres://."
              echo "::error::Copier la VALEUR de DIRECT_URL depuis .env, pas la ligne entière."
              exit 1 ;;
          esac

          case "$URL" in
            *:6543/*|*:6543\?*|*:6543)
              echo "::error::Port 6543 détecté — c'est le pooler en mode transaction, où pg_dump échoue."
              echo "::error::Utiliser le port 5432 (mode session), c'est-à-dire la valeur de DIRECT_URL."
              exit 1 ;;
          esac

          echo "Secrets présents, URL de forme correcte."

      # `pg_dump` refuse un serveur plus récent que lui : Supabase est en 17 et
      # le runner fournit un client 16, d'où l'installation du 17 depuis PGDG.
      # `/usr/bin/pg_dump` est le wrapper de postgresql-common, qui choisirait
      # encore le 16 : le binaire versionné est appelé par son chemin absolu.
      - name: Installer postgresql-client 17
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

          binaire=/usr/lib/postgresql/17/bin/pg_dump
          if [ ! -x "$binaire" ]; then
            echo "::error::$binaire absent — le paquet postgresql-client-17 ne s'est pas installé."
            exit 1
          fi

          version=$("$binaire" --version)
          echo "Client retenu : $version"
          case "$version" in
            *"pg_dump (PostgreSQL) 17."*) ;;
            *)
              echo "::error::Version inattendue : $version — on attendait un client 17."
              exit 1 ;;
          esac

          echo "PG_DUMP=$binaire" >> "$GITHUB_ENV"

      - name: Dump, contrôle de taille, chiffrement
        id: dump
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          nom="codeforge-$(date -u +%Y-%m-%d-%H%M).dump"

          # Chemin absolu du client 17, fixé par l'étape précédente : le
          # `pg_dump` du PATH est le wrapper, qui choisirait le client 16.
          "$PG_DUMP" "$URL" --format=custom --no-owner --no-privileges --file "$nom"

          taille=$(stat -c%s "$nom")
          echo "Dump : $taille octets"

          # Une sauvegarde vide est le mode de panne classique : le workflow
          # passe au vert, le fichier existe, et il ne contient rien. On refuse
          # plutôt que d'archiver une coquille.
          if [ "$taille" -lt 10240 ]; then
            echo "::error::Dump de $taille octets (< 10 Ko) — la base semble vide ou inaccessible."
            exit 1
          fi

          # La passphrase passe par un fichier plutôt que par --passphrase :
          # un argument de ligne de commande est visible dans la liste des
          # processus du runner.
          umask 077
          printf '%s' "$PASSPHRASE" > .passphrase
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase-file .passphrase -o "$nom.gpg" "$nom"
          shred -u .passphrase
          rm -f "$nom"

          echo "fichier=$nom.gpg" >> "$GITHUB_OUTPUT"
          echo "nom_artefact=${nom%.dump}" >> "$GITHUB_OUTPUT"

      - name: Déposer l'artefact chiffré
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ steps.dump.outputs.nom_artefact }}
          path: ${{ steps.dump.outputs.fichier }}
          retention-days: 90
          if-no-files-found: error
